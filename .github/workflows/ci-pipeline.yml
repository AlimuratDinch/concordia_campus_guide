name: Lint, Test, Build, and Maestro Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Required for Android SDK)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        working-directory: application
        run: npm install

      - name: Check TypeScript
        working-directory: application
        run: npm run type-check && echo "✅ TypeScript check passed!"

      - name: Lint code
        working-directory: application
        run: npm run lint

      - name: Build Expo app
        working-directory: application
        run: npx expo prebuild

      - name: Build Android APK
        working-directory: application/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          ./gradlew assembleDebug -PgoogleMapsApiKey=$GOOGLE_MAPS_API_KEY

      - name: Run tests
        working-directory: application
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: application/coverage/*.json
          flags: unittests
          fail_ci_if_error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: application/android/app/build/outputs/apk/debug/app-debug.apk
